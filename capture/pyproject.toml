[project]
name = "netsentinel-lab-capture"
version = "0.1.0"
description = "Captura pasiva HTTP/DNS para el laboratorio Visual MITM de NetSentinel"
requires-python = ">=3.8"
dependencies = [
  "scapy>=2.5,<3",
  "websockets>=12,<13"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1"
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
